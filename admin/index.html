<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gallo Gold — Administrador</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <script src="../shared/supabase.umd.js"></script>
  <script src="../shared/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="../shared/shared.css?v=3">
  <link rel="stylesheet" href="admin.css?v=3">
</head>

<body>

  <div id="app-shell" style="display:flex;width:100%;height:100%;flex-direction:row;position:relative;z-index:1;">

    <nav class="nav collapsed" id="nav">
      <div class="nav-top">
        <div class="nav-logo">
          <svg viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg"
            style="width: 22px; height: 22px; color: #0a0806;">
            <path d="M12 32C8 44 18 52 30 50c8-1 16-6 20-14 4-8 2-16-4-20" stroke="currentColor" stroke-width="3.2"
              stroke-linecap="round" opacity=".8" />
            <path d="M22 18C18 12 12 14 14 20c2 4 6 4 8 2M26 16c2-6 8-6 10-2 2 4-2 6-4 4" stroke="currentColor"
              stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M12 32L4 30l6 4" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"
              stroke-linejoin="round" />
            <circle cx="18" cy="28" r="2.5" fill="currentColor" />
            <path d="M24 46c-2 6 2 10 6 8" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" />
            <path d="M40 24c4-4 10-6 8-12" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
            <path d="M42 26c6-2 10-6 8-10" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
          </svg>
        </div>
        <div class="nav-brand">
          <span class="nav-brand-main">Gallo Gold</span>
          <span class="nav-brand-sub">By Pinitos</span>
        </div>
      </div>
      <div class="nav-body" id="nav-body"></div>
      <div class="nav-user-area">
        <div class="nav-user-card">
          <div class="nav-u-av" id="nav-av">–</div>
          <div class="nav-u-info">
            <div class="nav-u-name" id="nav-un">–</div>
            <div class="nav-u-role" id="nav-ur">Administrador</div>
          </div>
        </div>
      </div>
    </nav>

    <div class="main">
      <div class="detail">

        <div class="mob-header-bar" id="mob-hbar">
          <span class="mob-sel" id="mob-sel" style="font-size:13px;font-weight:700;color:var(--gold);">🐓 Gallo
            Gold</span>
          <div class="mob-user-badge" id="mob-user-badge">
            <div class="mob-u-av" id="mob-av-circle">–</div>
          </div>
          <button class="mob-tb-logout" onclick="doLogout()">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            Salir
          </button>
        </div>

        <div class="topbar" id="topbar">
          <div class="tb-spacer"></div>
          <div class="tb-user">
            <div class="tb-u-av" id="tb-av">–</div>
            <div>
              <div class="tb-u-name" id="tb-un">–</div>
              <div class="tb-u-role">Administrador</div>
            </div>
          </div>
          <button class="tb-logout" onclick="doLogout()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            Cerrar sesión
          </button>
        </div>

        <div class="tab-content visible" id="tab-dashboard">
          <div class="scroll-area" id="dash-wrap"></div>
        </div>

        <div class="tab-content" id="tab-fichas">
          <div style="display:flex; flex: 1; min-height: 0;">

            <div class="panel-list" id="panel-list">
              <div class="panel-list-head">
                <div class="pl-label">Jugadores</div>
                <div class="search-box">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                  </svg>
                  <input type="text" id="search-inp" placeholder="Buscar jugador..." oninput="filterJug()">
                </div>
              </div>
              <div class="list-scroll" id="jugadores-list"></div>
            </div>

            <div class="scroll-area" style="position:relative;">

              <div class="mob-jug-btn-wrap">
                <button class="mob-jug-btn" onclick="openDrawer()">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                    <path d="M23 21v-2a4 4 0 00-3-3.87" />
                    <path d="M16 3.13a4 4 0 010 7.75" />
                  </svg>
                  Seleccionar Jugador
                </button>
              </div>

              <div id="ficha-detail" style="display:none;"></div>

              <div id="fichas-empty" class="empty-center">
                <div class="er">👤</div>
                <p>Selecciona un jugador para ver su ficha</p>
              </div>

            </div>
          </div>
        </div>

        <div class="tab-content" id="tab-peleas">
          <div class="peleas-wrap">
            <div class="peleas-toolbar" id="peleas-toolbar"></div>
            <div class="peleas-scroll" id="peleas-scroll"></div>
          </div>
        </div>

        <div class="tab-content" id="tab-diario">
          <div class="periodo-header" id="diario-header" style="padding: 12px 14px 6px; flex-shrink: 0;"></div>
          <div style="display:flex; flex: 1; min-height: 0; border-top: 1px solid var(--border);">
            <div class="panel-list" id="panel-list-diario">
              <div class="panel-list-head" style="padding: 10px 12px;">
                <div class="pl-label">Apostadores</div>
                <div class="search-box">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
                  </svg>
                  <input type="text" id="search-inp-diario" placeholder="Buscar..." oninput="filterJugPeriodo('diario')">
                </div>
              </div>
              <div class="list-scroll" id="jugadores-list-diario"></div>
            </div>
            <div class="scroll-area" id="diario-wrap" style="position:relative; flex: 1; padding: 14px; display: flex; justify-content: center; align-items: flex-start;"></div>
          </div>
        </div>

        <div class="tab-content" id="tab-semanal">
          <div class="periodo-header" id="semanal-header" style="padding: 12px 14px 6px; flex-shrink: 0;"></div>
          <div style="display:flex; flex: 1; min-height: 0; border-top: 1px solid var(--border);">
            <div class="panel-list" id="panel-list-semanal">
              <div class="panel-list-head" style="padding: 10px 12px;">
                <div class="pl-label">Apostadores</div>
                <div class="search-box">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8" /><line x1="21" y1="21" x2="16.65" y2="16.65" />
                  </svg>
                  <input type="text" id="search-inp-semanal" placeholder="Buscar..." oninput="filterJugPeriodo('semanal')">
                </div>
              </div>
              <div class="list-scroll" id="jugadores-list-semanal"></div>
            </div>
            <div class="scroll-area" id="semanal-wrap" style="position:relative; flex: 1; padding: 14px; display: flex; justify-content: center; align-items: flex-start;"></div>
          </div>
        </div>

        <div class="tab-content" id="tab-bitacora">
          <div class="scroll-area" id="log-wrap"></div>
        </div>

        <div class="tab-content" id="tab-config">
          <div class="scroll-area" id="config-wrap"></div>
        </div>

      </div>
    </div>
    <nav class="mobile-bottom-nav" id="mob-bottom-nav"></nav>

    <div class="mob-drawer" id="mob-drawer">
      <div class="mob-drawer-overlay" onclick="closeDrawer()"></div>
      <div class="mob-drawer-panel" onclick="event.stopPropagation()">
        <div class="mob-drawer-handle"></div>
        <div class="mob-drawer-head">
          <div class="mob-drawer-title">📋 Lista de Jugadores</div>
          <button class="mob-drawer-close" onclick="closeDrawer()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <div style="padding:12px; border-bottom: 1px solid var(--border);">
          <div class="search-box">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" id="mob-search" placeholder="Buscar jugador..." oninput="filterJugMob()">
          </div>
        </div>
        <div class="mob-drawer-body" id="mob-jug-list"></div>
      </div>
    </div>

    <!-- ══ MODAL DETALLE PELEA ══ -->
    <div class="modal-overlay" id="modal-pelea-detalle" style="display:none;" onclick="cerrarDetallePelea()">
      <div class="modal-box" onclick="event.stopPropagation()" style="max-width: 680px; width: 100%;">
        <div class="modal-head">
          <span style="font-size:18px;">🏆</span>
          <span class="modal-title" id="pelea-detalle-title">Detalles de Pelea #0</span>
          <button class="modal-close" onclick="cerrarDetallePelea()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <div class="modal-body" id="pelea-detalle-body" style="padding: 12px 16px;"></div>
      </div>
    </div>

  </div>
  <div class="toast" id="toast">
    <div class="toast-line" id="tline"></div>
    <div class="toast-msg" id="tmsg"></div>
  </div>

  <script src="../shared/shared.js?v=3"></script>
  <script src="admin.js?v=3"></script>
</body>

</html>
